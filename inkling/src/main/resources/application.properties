# =============================================================================
# Inkling Application Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP Server
# -----------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173

# -----------------------------------------------------------------------------
# Database Configuration (PostgreSQL with pgvector)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# -----------------------------------------------------------------------------
# OpenAI Configuration
# -----------------------------------------------------------------------------
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:placeholder}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
quarkus.langchain4j.openai.chat-model.temperature=0.7
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small

# -----------------------------------------------------------------------------
# pgvector Embedding Store
# -----------------------------------------------------------------------------
quarkus.langchain4j.pgvector.dimension=1536
quarkus.langchain4j.pgvector.table=embeddings

# -----------------------------------------------------------------------------
# Document Processing
# -----------------------------------------------------------------------------
inkling.upload.max-size=10M
inkling.chunk.size=1000
inkling.chunk.overlap=200

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.inkling".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# -----------------------------------------------------------------------------
# Dev Services (automatic containers in dev mode)
# -----------------------------------------------------------------------------
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
%dev.quarkus.hibernate-orm.log.sql=true

# -----------------------------------------------------------------------------
# Test Profile
# -----------------------------------------------------------------------------
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# -----------------------------------------------------------------------------
# Production Profile
# -----------------------------------------------------------------------------
%prod.quarkus.datasource.username=${DB_USERNAME:inkling}
%prod.quarkus.datasource.password=${DB_PASSWORD:inkling}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inkling}
%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.log.category."com.inkling".level=INFO
